[project]
name = "probative-labs"
version = "0.1.0"
description = "Measure what AI actually changed: causal, graded, reproducible ROI evidence for enterprise AI programs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Vivek Reddy Gaddam", email = "vivekreddyvicky143@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["ai-roi", "causal-inference", "difference-in-differences", "itsm", "evidence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "jinja2>=3.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "typer>=0.12",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]

[project.urls]
Homepage = "https://github.com/VivekReddyGaddam/probative-labs"
Methodology = "https://github.com/VivekReddyGaddam/probative-labs/blob/main/docs/methodology.md"

[project.scripts]
probative = "probative.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
research = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Installed as `probative-labs`, imported as `probative`.
module-name = "probative"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
